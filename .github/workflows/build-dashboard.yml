name: Build Ceph Dashboard Frontend with i18n

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/pybind/mgr/dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/pybind/mgr/dashboard/frontend
        run: npm ci

      - name: Build with localization
        working-directory: src/pybind/mgr/dashboard/frontend
        run: npm run build:localize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ceph-dashboard-dist
          path: src/pybind/mgr/dashboard/frontend/dist/
          retention-days: 30
